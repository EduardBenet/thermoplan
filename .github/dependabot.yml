version: 2
updates:
  # GitHub Actions used by the deploy workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # npm: frontend build tooling (Vite) + firebase-tools used by the deploy workflow
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]

  # Cloud Functions runtime deps — functions/requirements.txt
  - package-ecosystem: "pip"
    directory: "/functions"
    schedule:
      interval: "weekly"
