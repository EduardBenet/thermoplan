version: 2
updates:
  # GitHub Actions used by the deploy workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Frontend build tooling (Vite + vite-plugin-pwa)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns: ["*"]

  # Cloud Functions runtime deps — functions/requirements.txt
  - package-ecosystem: "pip"
    directory: "/functions"
    schedule:
      interval: "weekly"
