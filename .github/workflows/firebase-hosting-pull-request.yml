name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: npm ci && npm run build
      # Preview deploy needs the service-account secret, which GitHub withholds
      # from Dependabot and cross-fork PRs. Skip it there - the build above is
      # what verifies those PRs.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THERMOPLAN_BENETMILIAN }}
          projectId: thermoplan-benetmilian
