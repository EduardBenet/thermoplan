name: Build & preview on PR
on: pull_request
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Preview deploy needs the service-account secret, which GitHub withholds
      # from Dependabot and cross-fork PRs. The build above is what verifies those.
      - name: Write service-account key
        if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/gcp-key.json"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THERMOPLAN_BENETMILIAN }}

      - name: Deploy preview channel
        if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: >
          npx --yes firebase-tools@14 hosting:channel:deploy "pr-${{ github.event.number }}"
          --project thermoplan-benetmilian
          --expires 7d --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
