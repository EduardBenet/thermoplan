name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- frontend ---
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # --- functions discovery needs the deployed runtime's Python ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: sudo ln -sf "$(command -v python3)" /usr/local/bin/python3.14

      # --- auth: service-account key from the repo secret ---
      - name: Write service-account key
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/gcp-key.json"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THERMOPLAN_BENETMILIAN }}

      - name: Deploy hosting + functions
        run: >
          npx --yes firebase-tools@15 deploy
          --only hosting,functions
          --project thermoplan-benetmilian
          --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
